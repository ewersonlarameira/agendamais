<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1f1f1f">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; connect-src 'self' https://xwtkfdfhmaaraodrusxx.supabase.co wss://xwtkfdfhmaaraodrusxx.supabase.co; style-src 'self'; img-src 'self' data:; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests">
  <title>Agendamento — Lumina's Clínica Estética</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.75.1" integrity="sha384-oKMgGe+iV6GiXAwVOAWrwx8rXSvyRUGT8R5Wl8Jas37cmI7i51qrvFUp+D/wwuf5" crossorigin="anonymous" defer></script>
  <script src="config.js" defer></script>
  <script src="agendar.js" defer></script>
</head>
<body class="public-page">
  <main class="booking-container">
    <header class="booking-header">
      <h1>✨ Lumina's Estética</h1>
      <p class="muted">Agendamento online</p>
    </header>

    <section id="step-1" class="step-card active" aria-labelledby="step-1-title">
      <h2 id="step-1-title">1. O que vamos realizar?</h2>
      <div class="input-group">
        <label for="select-procedimento">Procedimento</label>
        <select id="select-procedimento"><option value="">Carregando procedimentos...</option></select>
      </div>
      <button class="btn-primary btn-block" id="go-step-2" type="button">Continuar</button>
      <p id="procedure-public-message" class="status-message" role="status" aria-live="polite"></p>
    </section>

    <section id="step-2" class="step-card" aria-labelledby="step-2-title">
      <h2 id="step-2-title">2. Escolha o melhor momento</h2>
      <div class="input-group">
        <label for="input-data">Data</label>
        <input type="date" id="input-data">
      </div>
      <div class="input-group hidden" id="container-horarios">
        <label>Horários disponíveis</label>
        <div id="loader-horarios" class="loader hidden">Buscando horários...</div>
        <div class="time-grid" id="grid-horarios"></div>
      </div>
      <p id="schedule-public-message" class="status-message" role="status" aria-live="polite"></p>
      <button class="btn-primary btn-block hidden" id="go-step-3" type="button">Continuar</button>
      <button class="btn-secondary btn-block" type="button" data-back="step-1">Voltar</button>
    </section>

    <section id="step-3" class="step-card" aria-labelledby="step-3-title">
      <h2 id="step-3-title">3. Seus dados</h2>
      <p class="muted small">Informe os dados de contato para finalizar.</p>
      <form id="public-booking-form">
        <div class="input-group"><label for="input-nome">Nome completo</label><input type="text" id="input-nome" maxlength="120" autocomplete="name" required></div>
        <div class="input-group"><label for="input-whatsapp">WhatsApp</label><input type="tel" id="input-whatsapp" maxlength="24" autocomplete="tel" required></div>
        <button class="btn-primary btn-block" id="btn-finalizar" type="submit">Confirmar agendamento</button>
      </form>
      <p id="booking-public-message" class="status-message" role="status" aria-live="polite"></p>
      <button class="btn-secondary btn-block" type="button" data-back="step-2">Voltar</button>
    </section>

    <section id="step-4" class="step-card" aria-labelledby="step-4-title">
      <span class="success-icon" aria-hidden="true">✅</span>
      <h2 id="step-4-title">Tudo certo!</h2>
      <p class="muted">Seu horário foi reservado com sucesso.</p>
      <div class="booking-summary">
        <p><strong>Procedimento:</strong> <span id="resumo-proc"></span></p>
        <p><strong>Data:</strong> <span id="resumo-data"></span></p>
        <p><strong>Hora:</strong> <span id="resumo-hora"></span></p>
      </div>
      <button class="btn-primary btn-block btn-whatsapp" id="send-whatsapp" type="button">📱 Avisar clínica no WhatsApp</button>
      <button class="btn-primary btn-block btn-google" id="add-google-calendar" type="button">📅 Salvar no Google Agenda</button>
    </section>
  </main>
</body>
</html>
